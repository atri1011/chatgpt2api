services:
  app:
    image: ghcr.io/basketikun/chatgpt2api:latest
    container_name: chatgpt2api
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      # 存储后端配置 (可选值: json, sqlite, postgres, git, cloudflare_d1)
       - STORAGE_BACKEND=json
      
      # 数据库配置 (当 STORAGE_BACKEND=sqlite/postgres 时使用)
      # - DATABASE_URL=postgresql://user:password@host:5432/dbname
      # - DATABASE_URL=sqlite:///app/data/accounts.db
      
      # Git 仓库配置 (当 STORAGE_BACKEND=git 时使用)
      # - GIT_REPO_URL=https://github.com/user/repo.git
      # - GIT_TOKEN=ghp_xxxxxxxxxxxx
      # - GIT_BRANCH=main
      # - GIT_FILE_PATH=accounts.json

      # Cloudflare D1 配置 (当 STORAGE_BACKEND=cloudflare_d1 时使用)
      # - CLOUDFLARE_ACCOUNT_ID=your_account_id
      # - CLOUDFLARE_D1_DATABASE_ID=your_database_uuid
      # - CLOUDFLARE_API_TOKEN=your_cloudflare_api_token
      
      # 认证密钥 (可选，覆盖 config.json)
      # - CHATGPT2API_AUTH_KEY=your_secret_key
      
      # 基础 URL (可选)
      # - CHATGPT2API_BASE_URL=https://your-domain.com

      # 图片 provider 配置
      # - CHATGPT2API_IMAGE_PROVIDER=chatgpt_web
      # - CHATGPT2API_IMAGE_API_BASE_URL=https://your-image-api.example.com
      # - CHATGPT2API_IMAGE_API_KEY=sk-your-image-api-key
      # - CHATGPT2API_IMAGE_TIMEOUT_SEC=300
      # - CHATGPT2API_IMAGE_DEFAULT_MODEL=gpt-image-2
      #
      # 说明:
      # 1. 默认 `chatgpt_web` 继续走当前 ChatGPT Web 账号池生图链路
      # 2. 切到 `linggan10s` 时，图生图会先把参考图写到 `/images/*`，再转成上游可回拉 URL
      # 3. 若要在 `linggan10s` 下使用图生图，请确保 `CHATGPT2API_BASE_URL` 是公网可访问域名，不要填 localhost/127.0.0.1
